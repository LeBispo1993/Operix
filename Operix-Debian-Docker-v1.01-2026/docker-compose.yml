services:
  db:
    image: postgres:16-alpine
    container_name: operix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operix}
      POSTGRES_USER: ${POSTGRES_USER:-operix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - operix_db:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-operix} -d ${POSTGRES_DB:-operix}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    security_opt:
      - no-new-privileges:true
  api:
    build: ./apps/api
    container_name: operix-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-operix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-operix}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    depends_on:
      db: {condition: service_healthy}
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
  web:
    build: ./apps/web
    container_name: operix-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: {condition: service_healthy}
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
volumes:
  operix_db:
networks:
  backend: {internal: true}
  frontend: {}
